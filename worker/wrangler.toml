# Signal Shelf cloud backend. Deployed by .github/workflows/deploy.yml on every push to main.
name = "signalshelf"
main = "src/index.js"
compatibility_date = "2025-11-01"
workers_dev = true
preview_urls = false

[assets]
directory = "../server/public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "signalshelf"
# Filled in automatically by the deploy workflow (it creates the database on first run).
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
# iCloud link of the generic "Save to Signal Shelf" Shortcut (opens /app/#add=<url>). Empty = manual steps only.
SHORTCUT_ICLOUD_URL = ""
# Google sign-in: OAuth client ID (public). GOOGLE_CLIENT_SECRET is a secret set by the deploy workflow. Both needed to show the button.
# Public profiles, People, follows, Following feed and landing picks. "true" turns sharing on.
SOCIAL_ENABLED = ""
GOOGLE_CLIENT_ID = "936180583782-t6gtoresuogamskln4ddcadb62l5ohpk.apps.googleusercontent.com"

[observability]
enabled = true
